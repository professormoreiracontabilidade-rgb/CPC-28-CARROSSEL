const TOTAL=25,KEY='moreira_cpc28_slide_v1';let pos=Number(localStorage.getItem(KEY)||0);if(!Number.isInteger(pos)||pos<0||pos>=TOTAL)pos=0;const img=document.getElementById('slide'),counter=document.getElementById('counter'),fill=document.getElementById('fill'),prev=document.getElementById('prev'),next=document.getElementById('next');function render(){img.src=SLIDES[pos];img.alt='CPC 28 — imagem '+(pos+1)+' de 25';counter.textContent='TELA '+(pos+1)+' DE '+TOTAL;fill.style.width=((pos+1)/TOTAL*100)+'%';prev.disabled=pos===0;next.disabled=pos===TOTAL-1;localStorage.setItem(KEY,String(pos))}function go(n){pos=Math.max(0,Math.min(TOTAL-1,n));render()}prev.onclick=()=>go(pos-1);next.onclick=()=>go(pos+1);document.getElementById('restart').onclick=()=>go(0);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(pos+1);if(e.key==='ArrowLeft')go(pos-1);if(e.key==='Home')go(0)});let startX=0;const stage=document.getElementById('stage');stage.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>45)go(pos+(dx<0?1:-1))},{passive:true});render();
