<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10145d"><title>CPC 28 | Professor Moreira</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 15% 15%,#5534d8,transparent 38%),radial-gradient(circle at 85% 85%,#0063c7,transparent 40%),#10145d;color:#fff;font-family:system-ui,Arial,sans-serif}main{max-width:900px;min-height:100dvh;margin:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.brand{text-align:center;font-size:clamp(14px,3vw,22px);font-weight:900;color:#ffe54d;text-transform:uppercase}.heading{text-align:center;font-weight:900;font-size:clamp(20px,4.8vw,34px);line-height:1.12}.counter{text-align:center;font-weight:800;color:#e7e9ff}.stage{flex:1;display:flex;justify-content:center;align-items:center;min-height:200px}.panel{width:min(100%,760px);background:#fff;border:5px solid #ffe100;border-radius:20px;box-shadow:0 12px 30px #0008;padding:10px}.panel img{width:100%;height:auto;display:block;image-rendering:auto;border-radius:10px}.controls{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap;padding-bottom:max(10px,env(safe-area-inset-bottom))}button{border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:900;cursor:pointer;background:#ffcf00;color:#10145d;min-width:105px}button:disabled{opacity:.4;cursor:default}.restart{background:#fff;color:#191454}.bar{height:9px;border-radius:9px;background:#ffffff40;overflow:hidden}.fill{height:100%;background:#ffcf00;transition:width .2s}footer{text-align:center;font-size:12px;color:#d8d8ff}@media(min-width:700px){.panel{padding:22px}.controls button{font-size:19px;padding:15px 25px}}@media(max-height:550px){main{gap:6px}.panel{max-width:480px}.brand{font-size:13px}.heading{font-size:19px}}
</style></head><body><main><div class="brand">Curso de Contabilidade Professor Moreira</div><div class="heading">PROPRIEDADE PARA INVESTIMENTO · CPC 28</div><div class="counter" id="counter" aria-live="polite"></div><div class="bar"><div class="fill" id="fill"></div></div><div class="stage" id="stage"><div class="panel"><img id="slide" alt="Imagem educativa do CPC 28" draggable="false"></div></div><div class="controls"><button id="prev">◀ Voltar</button><button class="restart" id="restart">↻ Reiniciar</button><button id="next">Avançar ▶</button></div><footer>Deslize para os lados ou use as setas do teclado · WhatsApp: (61) 98532-3574</footer></main><script>
const TOTAL=25,KEY='moreira_cpc28_slide_v1';let pos=Number(localStorage.getItem(KEY)||0);if(!Number.isInteger(pos)||pos<0||pos>=TOTAL)pos=0;const img=document.getElementById('slide'),counter=document.getElementById('counter'),fill=document.getElementById('fill'),prev=document.getElementById('prev'),next=document.getElementById('next');function render(){img.src='imagens/cpc28_'+String(pos+1).padStart(2,'0')+'.webp';img.alt='CPC 28 — imagem '+(pos+1)+' de 25';counter.textContent='TELA '+(pos+1)+' DE '+TOTAL;fill.style.width=((pos+1)/TOTAL*100)+'%';prev.disabled=pos===0;next.disabled=pos===TOTAL-1;localStorage.setItem(KEY,String(pos))}function go(n){pos=Math.max(0,Math.min(TOTAL-1,n));render()}prev.onclick=()=>go(pos-1);next.onclick=()=>go(pos+1);document.getElementById('restart').onclick=()=>go(0);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(pos+1);if(e.key==='ArrowLeft')go(pos-1);if(e.key==='Home')go(0)});let startX=0;const stage=document.getElementById('stage');stage.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>45)go(pos+(dx<0?1:-1))},{passive:true});render();
</script></body></html>
